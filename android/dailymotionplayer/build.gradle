apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

repositories {
    google()
    mavenCentral()
    maven {
        name = "DailymotionMavenRelease"
        url = uri("https://mvn.dailymotion.com/repository/releases/")
    }
}

android {
    namespace 'com.newreactnativedailymotionsdk.player'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        minSdk rootProject.ext.minSdkVersion
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation 'com.dailymotion.player.android:sdk:2.1.1'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'com.dailymotion.player.android:ads:2.1.1'
    implementation 'com.google.ads.interactivemedia.v3:interactivemedia:3.33.0'
}
